<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 Control</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
  body{font-family:sans-serif;max-width:420px;margin:24px auto;padding:0 16px}
  .card{border:1px solid #ccc;border-radius:12px;padding:16px;margin-bottom:12px}
  .row{display:flex;justify-content:space-between;padding:6px 0}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  button{padding:14px;font-size:16px;border:0;border-radius:10px;color:#fff}
  .on{background:#1a9c3c}.off{background:#c0392b}.blue{background:#2b7de9;width:100%}
  .st-on{color:#1a9c3c;font-weight:bold}.st-off{color:#999}
</style>
</head>
<body>
<h2>ควบคุม ESP32</h2>
<div class="card">
  <div class="row"><span>การเชื่อมต่อ</span><span id="conn">กำลังเชื่อมต่อ...</span></div>
  <div class="row"><span>สัญญาณ</span><span id="rssi">-</span></div>
  <div class="row"><span>ทำงานมาแล้ว</span><span id="up">-</span></div>
  <div class="row"><span>ไฟ LED</span><span id="led">-</span></div>
  <div class="row"><span>รีเลย์</span><span id="relay">-</span></div>
</div>

<div class="btns">
  <button class="on"  onclick="send('relay_on')">เปิดรีเลย์</button>
  <button class="off" onclick="send('relay_off')">ปิดรีเลย์</button>
</div>
<button class="blue" onclick="send('toggle')">สลับไฟ LED</button>

<script>
const STATUS = 'tanwela-demo-8421/status';
const CMD    = 'tanwela-demo-8421/cmd';
const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

function send(cmd){ client.publish(CMD, cmd); }
function setState(el, on){
  el.textContent = on ? 'ติด' : 'ดับ';
  el.className = on ? 'st-on' : 'st-off';
}

client.on('connect', () => { conn.textContent = 'เชื่อมต่อแล้ว'; client.subscribe(STATUS); });
client.on('close',   () => conn.textContent = 'ขาดการเชื่อมต่อ');
client.on('message', (t, m) => {
  const d = JSON.parse(m.toString());
  rssi.textContent = d.rssi + ' dBm';
  up.textContent = d.uptime + ' วินาที';
  setState(led, d.led);
  setState(relay, d.relay);
});
</script>
</body>
</html>
